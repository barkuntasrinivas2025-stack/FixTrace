name: FixTrace CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Cedar CLI
        run: |
          curl -L https://github.com/cedar-policy/cedar/releases/latest/download/cedar-linux-x86_64 -o cedar
          chmod +x cedar
          sudo mv cedar /usr/local/bin/cedar
          cedar --version

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check Git whitespace
        run: git diff --check
